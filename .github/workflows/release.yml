name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # GitHub Release
  id-token: write      # npm --provenance (Sigstore OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:encoding
      - run: pnpm validate:manifest
      - run: pnpm test
      - run: pnpm pack:verify

      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # Idempotent: a version published by hand (npm publish locally) must
          # not fail the tag run that follows it — the tag still gets its
          # GitHub Release.
          if npm view "dsh-peak-balance@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::dsh-peak-balance@$VERSION is already on npm; skipping publish"
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
